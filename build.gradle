plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude development-only resources.
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()

    // Create, Ponder and Flywheel
    maven {
        url = "https://maven.createmod.net"
    }

    // Registrate
    maven {
        url = "https://maven.ithundxr.dev/snapshots"
    }

    // JEI
    maven {
        url = "https://maven.blamejared.com"
    }

    // Jade
    maven {
        url = "https://www.cursemaven.com"
    }

    // Dependency used by Ponder
    maven {
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven"
    }

    // NeoForge
    maven {
        url = "https://maven.neoforged.net/releases"
    }
}

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 uses Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            jvmArgument '-Xmx8G'

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll(
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
            )
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Dependencies only needed while developing/running the mod locally.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // ------------------------------------------------------------
    // Create
    // ------------------------------------------------------------

    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }

    // ------------------------------------------------------------
    // Ponder
    //
    // ponder_version already contains +mc1.21.1 in gradle.properties.
    // Example:
    // ponder_version=1.0.87+mc1.21.1
    // ------------------------------------------------------------

    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}")

    // ------------------------------------------------------------
    // Flywheel
    // ------------------------------------------------------------

    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")

    // ------------------------------------------------------------
    // Registrate
    // ------------------------------------------------------------

    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // ------------------------------------------------------------
    // JEI
    // ------------------------------------------------------------

    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    // ------------------------------------------------------------
    // Jade
    // ------------------------------------------------------------

    compileOnly("curse.maven:jade-324717:${jade_file_id}")
    localRuntime("curse.maven:jade-324717:${jade_file_id}")

    // ------------------------------------------------------------
    // Other libraries
    // ------------------------------------------------------------

    implementation("com.google.code.gson:gson:2.10.1")
}

// Expand properties used by neoforge.mods.toml and other template resources.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]

    inputs.properties replaceProperties
    expand replaceProperties

    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include generated metadata in the resources.
sourceSets.main.resources.srcDir generateModMetadata

// Generate metadata automatically when IntelliJ/Gradle syncs.
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}